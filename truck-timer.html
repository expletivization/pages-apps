<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Truck Timer</title>
  <style>
    :root {
      --bg1: #eaf6ff;
      --bg2: #fff8dc;
      --ink: #153243;
      --muted: #5c7280;
      --card: rgba(255, 255, 255, 0.82);
      --card-solid: #ffffff;
      --shadow: 0 24px 70px rgba(21, 50, 67, 0.16);
      --soft-shadow: 0 10px 25px rgba(21, 50, 67, 0.12);
      --road: #46535b;
      --road-edge: #303a40;
      --grass: #80c969;
      --yellow: #ffd94a;
      --blue: #45aaf2;
      --green: #56d06f;
      --red: #ff5c5c;
      --orange: #ff9f43;
      --purple: #9b7bff;
      --white: #ffffff;
      --radius: 30px;
      font-family: Inter, ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(255, 217, 74, 0.35), transparent 36rem),
        radial-gradient(circle at bottom right, rgba(69, 170, 242, 0.28), transparent 34rem),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      overflow-x: hidden;
    }

    .page {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .title-block h1 {
      margin: 0;
      font-size: clamp(2.2rem, 7vw, 5.5rem);
      line-height: 0.92;
      letter-spacing: -0.07em;
    }

    .title-block p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.2vw, 1.25rem);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: var(--soft-shadow);
      font-weight: 800;
      white-space: nowrap;
    }

    .status-dot {
      width: 14px;
      height: 14px;
      border-radius: 999px;
      background: var(--green);
      box-shadow: 0 0 0 7px rgba(86, 208, 111, 0.18);
    }

    .status-dot.paused { background: var(--orange); box-shadow: 0 0 0 7px rgba(255, 159, 67, 0.18); }
    .status-dot.done { background: var(--blue); box-shadow: 0 0 0 7px rgba(69, 170, 242, 0.18); }
    .status-dot.stopped { background: #b5c2cb; box-shadow: 0 0 0 7px rgba(181, 194, 203, 0.22); }

    .app-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(320px, 0.75fr);
      gap: 22px;
      align-items: stretch;
    }

    .track-card, .controls-card {
      background: var(--card);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.62);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .track-card {
      position: relative;
      min-height: 620px;
      padding: 24px;
    }

    .controls-card {
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .skyline {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      opacity: 0.9;
    }

    .cloud {
      position: absolute;
      width: 110px;
      height: 42px;
      background: rgba(255, 255, 255, 0.72);
      border-radius: 999px;
      filter: drop-shadow(0 8px 15px rgba(21, 50, 67, 0.08));
      animation: floatCloud 18s ease-in-out infinite;
    }

    .cloud::before, .cloud::after {
      content: "";
      position: absolute;
      background: inherit;
      border-radius: 50%;
    }

    .cloud::before { width: 54px; height: 54px; left: 18px; top: -24px; }
    .cloud::after { width: 62px; height: 62px; right: 15px; top: -31px; }
    .cloud.one { left: 8%; top: 12%; }
    .cloud.two { right: 10%; top: 7%; transform: scale(0.78); animation-delay: -7s; }
    .cloud.three { left: 42%; top: 18%; transform: scale(0.6); animation-delay: -11s; }

    @keyframes floatCloud {
      0%, 100% { translate: 0 0; }
      50% { translate: 28px -8px; }
    }

    .track-wrap {
      position: relative;
      height: 100%;
      min-height: 570px;
      display: grid;
      place-items: center;
      z-index: 1;
    }

    .track-scene {
      width: min(100%, 720px);
      aspect-ratio: 1 / 1;
      position: relative;
      display: grid;
      place-items: center;
    }

    .grass {
      position: absolute;
      inset: 8%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 38% 34%, rgba(255,255,255,0.38), transparent 16%),
        repeating-linear-gradient(45deg, rgba(255,255,255,0.08) 0 10px, transparent 10px 24px),
        var(--grass);
      box-shadow: inset 0 12px 30px rgba(0, 0, 0, 0.07);
    }

    .road {
      position: absolute;
      inset: 7%;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #4b5962, #3f4c55, #56656e, #3f4c55, #4b5962);
      box-shadow:
        inset 0 0 0 22px var(--road-edge),
        inset 0 0 0 86px var(--road),
        inset 0 0 0 104px var(--road-edge),
        0 24px 45px rgba(21, 50, 67, 0.20);
    }

    .road::after {
      content: "";
      position: absolute;
      inset: 79px;
      border-radius: 50%;
      border: 10px dashed rgba(255, 217, 74, 0.9);
      opacity: 0.9;
    }

    .center-island {
      position: absolute;
      inset: 31%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 28%, rgba(255,255,255,0.8), transparent 22%),
        linear-gradient(145deg, #9be57d, #62bd58);
      box-shadow: inset 0 14px 30px rgba(0,0,0,0.08), 0 10px 30px rgba(21, 50, 67, 0.12);
      display: grid;
      place-items: center;
      text-align: center;
      padding: 20px;
    }

    .time-display {
      font-size: clamp(2.6rem, 8vw, 5.4rem);
      font-weight: 950;
      letter-spacing: -0.08em;
      line-height: 0.92;
      color: #123044;
      text-shadow: 0 3px 0 rgba(255,255,255,0.5);
    }

    .time-label {
      margin-top: 10px;
      font-size: clamp(0.95rem, 2vw, 1.2rem);
      color: rgba(18, 48, 68, 0.72);
      font-weight: 850;
    }

    .vehicle-layer {
      position: absolute;
      inset: 0;
      transform-origin: 50% 50%;
      will-change: transform;
      transition: transform 0.2s linear;
    }

    .vehicle-positioner {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 128px;
      height: 78px;
      translate: -50% -50%;
      transform: translateY(calc(-1 * min(35vw, 250px)));
      filter: drop-shadow(0 15px 10px rgba(0, 0, 0, 0.18));
    }

    .vehicle-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .wheel {
      transform-origin: center;
    }

    .track-card.running #vehicleMount .wheel {
      animation: wheelSpin 0.55s linear infinite;
    }

    .vehicle-preview .wheel {
      animation: none;
    }

    @keyframes wheelSpin { to { transform: rotate(360deg); } }

    .confetti {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      display: none;
    }

    .done .confetti { display: block; }

    .confetti span {
      position: absolute;
      top: -24px;
      width: 12px;
      height: 20px;
      border-radius: 4px;
      background: var(--yellow);
      animation: confettiFall 2.6s linear infinite;
    }

    .confetti span:nth-child(2n) { background: var(--blue); }
    .confetti span:nth-child(3n) { background: var(--red); }
    .confetti span:nth-child(4n) { background: var(--green); }
    .confetti span:nth-child(5n) { background: var(--purple); }

    @keyframes confettiFall {
      from { translate: 0 -20px; rotate: 0deg; opacity: 0; }
      8% { opacity: 1; }
      to { translate: var(--fall-x, 0px) 760px; rotate: 460deg; opacity: 0; }
    }

    .panel-title {
      margin: 0 0 10px;
      font-size: 1.05rem;
      font-weight: 950;
      letter-spacing: -0.02em;
    }

    .duration-box {
      background: rgba(255, 255, 255, 0.62);
      border-radius: 24px;
      padding: 16px;
      border: 1px solid rgba(255,255,255,0.7);
    }

    .duration-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }

    input[type="number"] {
      width: 100%;
      appearance: textfield;
      border: 0;
      outline: none;
      padding: 16px;
      border-radius: 18px;
      font-size: 1.35rem;
      font-weight: 900;
      color: var(--ink);
      background: white;
      box-shadow: inset 0 0 0 2px rgba(21, 50, 67, 0.08);
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { opacity: 1; }

    .unit {
      font-weight: 950;
      color: var(--muted);
    }

    .quick-times {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    button {
      border: 0;
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .chip, .vehicle-option, .primary-button, .secondary-button {
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
    }

    .chip:active, .vehicle-option:active, .primary-button:active, .secondary-button:active { transform: scale(0.97); }

    .chip {
      padding: 11px 8px;
      border-radius: 14px;
      background: #fff;
      color: var(--ink);
      font-weight: 900;
      box-shadow: inset 0 0 0 2px rgba(21, 50, 67, 0.08);
    }

    .chip:hover { box-shadow: inset 0 0 0 2px rgba(69, 170, 242, 0.35), var(--soft-shadow); }

    .vehicle-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .vehicle-option {
      min-height: 112px;
      padding: 12px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.66);
      border: 2px solid transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--ink);
      font-weight: 950;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.55);
    }

    .vehicle-option.selected {
      background: #fff;
      border-color: var(--blue);
      box-shadow: 0 12px 26px rgba(69, 170, 242, 0.18);
    }

    .vehicle-preview {
      width: 100px;
      height: 54px;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 10px;
    }

    .primary-button, .secondary-button {
      min-height: 64px;
      border-radius: 22px;
      font-size: 1.12rem;
      font-weight: 950;
      box-shadow: var(--soft-shadow);
    }

    .primary-button {
      background: linear-gradient(145deg, var(--blue), #2887d8);
      color: white;
    }

    .primary-button.pause { background: linear-gradient(145deg, var(--orange), #eb7f20); }
    .primary-button.restart { background: linear-gradient(145deg, var(--green), #30b84d); }

    .secondary-button {
      background: white;
      color: var(--ink);
    }

    .progress-box {
      padding: 16px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.62);
      border: 1px solid rgba(255,255,255,0.7);
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-weight: 850;
      margin-bottom: 9px;
    }

    .progress-shell {
      height: 22px;
      border-radius: 999px;
      background: rgba(21, 50, 67, 0.12);
      overflow: hidden;
      box-shadow: inset 0 2px 5px rgba(21, 50, 67, 0.11);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: repeating-linear-gradient(45deg, rgba(255,255,255,0.32) 0 12px, transparent 12px 24px), linear-gradient(90deg, var(--yellow), var(--orange));
      transition: width 0.2s linear;
    }

    .sound-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.62);
      border-radius: 22px;
      font-weight: 900;
      color: var(--muted);
    }

    .toggle {
      width: 58px;
      height: 34px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(21, 50, 67, 0.16);
      position: relative;
    }

    .toggle span {
      display: block;
      width: 26px;
      height: 26px;
      border-radius: 999px;
      background: white;
      box-shadow: 0 3px 8px rgba(21, 50, 67, 0.25);
      transition: translate 0.16s ease;
    }

    .toggle.on { background: var(--green); }
    .toggle.on span { translate: 24px 0; }

    .tiny-note {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.35;
      margin: -4px 4px 0;
    }

    .trees {
      position: absolute;
      inset: auto 0 0;
      height: 120px;
      pointer-events: none;
      overflow: hidden;
      opacity: 0.84;
    }

    .tree {
      position: absolute;
      bottom: 0;
      width: 30px;
      height: 90px;
      background: #7b4e2c;
      border-radius: 12px 12px 0 0;
    }

    .tree::before {
      content: "";
      position: absolute;
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: #3fb364;
      left: 50%;
      top: -58px;
      translate: -50% 0;
      box-shadow: -27px 18px 0 #51c878, 27px 16px 0 #2fa956;
    }

    @media (max-width: 920px) {
      .app-grid { grid-template-columns: 1fr; }
      header { align-items: flex-start; flex-direction: column; }
      .track-card { min-height: auto; }
      .track-wrap { min-height: 500px; }
      .vehicle-positioner { transform: translateY(calc(-1 * min(37vw, 214px))); }
    }

    @media (max-width: 560px) {
      .page { padding: 16px; }
      .track-card, .controls-card { border-radius: 24px; }
      .track-card { padding: 14px; }
      .track-wrap { min-height: 410px; }
      .vehicle-positioner { width: 96px; height: 62px; transform: translateY(calc(-1 * min(36vw, 160px))); }
      .road::after { inset: 53px; border-width: 7px; }
      .road { box-shadow: inset 0 0 0 15px var(--road-edge), inset 0 0 0 58px var(--road), inset 0 0 0 72px var(--road-edge), 0 20px 34px rgba(21, 50, 67, 0.16); }
      .center-island { inset: 33%; }
      .vehicle-grid { grid-template-columns: 1fr; }
      .quick-times { grid-template-columns: repeat(2, 1fr); }
      .button-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="title-block">
        <h1>Truck Timer</h1>
        <p>Pick a vehicle. Start the race. Watch it drive around the track.</p>
      </div>
      <div class="status-pill" aria-live="polite">
        <span id="statusDot" class="status-dot stopped"></span>
        <span id="statusText">Ready to roll</span>
      </div>
    </header>

    <section class="app-grid">
      <div id="trackCard" class="track-card stopped">
        <div class="skyline" aria-hidden="true">
          <div class="cloud one"></div>
          <div class="cloud two"></div>
          <div class="cloud three"></div>
        </div>

        <div class="track-wrap">
          <div class="track-scene" aria-label="A circular road track with a vehicle showing timer progress">
            <div class="grass"></div>
            <div class="road"></div>
            <div class="center-island">
              <div>
                <div id="timeDisplay" class="time-display">10:00</div>
                <div id="timeLabel" class="time-label">ready for a drive</div>
              </div>
            </div>
            <div id="vehicleLayer" class="vehicle-layer">
              <div class="vehicle-positioner">
                <div id="vehicleMount"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="confetti" id="confetti" aria-hidden="true"></div>

        <div class="trees" aria-hidden="true">
          <div class="tree" style="left: 7%; transform: scale(.85)"></div>
          <div class="tree" style="left: 22%; transform: scale(.65)"></div>
          <div class="tree" style="right: 18%; transform: scale(.78)"></div>
          <div class="tree" style="right: 6%; transform: scale(.58)"></div>
        </div>
      </div>

      <aside class="controls-card" aria-label="Timer controls">
        <div class="duration-box">
          <h2 class="panel-title">How long?</h2>
          <div class="duration-row">
            <input id="minutesInput" type="number" min="1" max="240" step="1" value="10" aria-label="Timer duration in minutes" />
            <div class="unit">minutes</div>
          </div>
          <div class="quick-times" aria-label="Quick time buttons">
            <button class="chip" data-minutes="1">1</button>
            <button class="chip" data-minutes="5">5</button>
            <button class="chip" data-minutes="10">10</button>
            <button class="chip" data-minutes="20">20</button>
          </div>
        </div>

        <div>
          <h2 class="panel-title">Choose your vehicle</h2>
          <div id="vehicleGrid" class="vehicle-grid"></div>
        </div>

        <div class="button-row">
          <button id="startPauseButton" class="primary-button">Start driving</button>
          <button id="resetButton" class="secondary-button">Reset</button>
        </div>

        <div class="progress-box">
          <div class="progress-meta">
            <span id="progressText">0% driven</span>
            <span id="lapText">Lap 1</span>
          </div>
          <div class="progress-shell">
            <div id="progressFill" class="progress-fill"></div>
          </div>
        </div>

        <div class="sound-row">
          <span>Celebration sounds</span>
          <button id="soundToggle" class="toggle on" aria-pressed="true" aria-label="Toggle celebration sounds"><span></span></button>
        </div>
        <p class="tiny-note">The timer is saved in this browser. A refresh keeps the same vehicle, time, and progress.</p>
      </aside>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "truck-timer-state-v1";
    const DEFAULT_MINUTES = 10;

    const vehicles = {
      bigTruck: {
        name: "Big Truck",
        color: "#3b82f6",
        svg: (scale = 1) => `
          <svg class="vehicle-svg" viewBox="0 0 180 96" role="img" aria-label="Big truck">
            <rect x="20" y="36" width="100" height="34" rx="10" fill="#3b82f6"/>
            <rect x="112" y="44" width="42" height="26" rx="8" fill="#2563eb"/>
            <path d="M122 27h24c8 0 16 12 18 22h-42z" fill="#60a5fa"/>
            <rect x="29" y="27" width="78" height="21" rx="7" fill="#93c5fd"/>
            <rect x="130" y="32" width="18" height="14" rx="3" fill="#dbeafe"/>
            <rect x="7" y="59" width="24" height="12" rx="5" fill="#1e40af"/>
            <rect x="151" y="58" width="21" height="12" rx="5" fill="#1e40af"/>
            <circle class="wheel" cx="51" cy="72" r="16" fill="#111827"/>
            <circle cx="51" cy="72" r="7" fill="#d1d5db"/>
            <circle class="wheel" cx="131" cy="72" r="16" fill="#111827"/>
            <circle cx="131" cy="72" r="7" fill="#d1d5db"/>
            <circle cx="166" cy="56" r="4" fill="#fde047"/>
          </svg>`
      },
      littleTruck: {
        name: "Little Truck",
        color: "#22c55e",
        svg: () => `
          <svg class="vehicle-svg" viewBox="0 0 180 96" role="img" aria-label="Little truck">
            <rect x="34" y="42" width="80" height="27" rx="9" fill="#22c55e"/>
            <path d="M108 35h30c8 0 14 11 16 23h-46z" fill="#16a34a"/>
            <rect x="116" y="40" width="19" height="14" rx="3" fill="#dcfce7"/>
            <rect x="44" y="32" width="58" height="22" rx="8" fill="#86efac"/>
            <rect x="17" y="58" width="24" height="11" rx="5" fill="#15803d"/>
            <rect x="149" y="58" width="17" height="10" rx="5" fill="#15803d"/>
            <circle class="wheel" cx="57" cy="71" r="14" fill="#111827"/>
            <circle cx="57" cy="71" r="6" fill="#d1d5db"/>
            <circle class="wheel" cx="127" cy="71" r="14" fill="#111827"/>
            <circle cx="127" cy="71" r="6" fill="#d1d5db"/>
            <circle cx="160" cy="56" r="4" fill="#fde047"/>
          </svg>`
      },
      car: {
        name: "Car",
        color: "#f97316",
        svg: () => `
          <svg class="vehicle-svg" viewBox="0 0 180 96" role="img" aria-label="Car">
            <path d="M31 58c5-17 18-27 37-27h40c18 0 32 11 40 27l17 4v10H17V62z" fill="#f97316"/>
            <path d="M64 36h40c12 0 22 8 28 20H43c4-12 10-20 21-20z" fill="#fdba74"/>
            <path d="M74 39h23v17H57c3-10 8-17 17-17z" fill="#fff7ed"/>
            <path d="M102 39h6c9 0 16 6 21 17h-27z" fill="#fff7ed"/>
            <circle class="wheel" cx="55" cy="72" r="15" fill="#111827"/>
            <circle cx="55" cy="72" r="6" fill="#e5e7eb"/>
            <circle class="wheel" cx="128" cy="72" r="15" fill="#111827"/>
            <circle cx="128" cy="72" r="6" fill="#e5e7eb"/>
            <circle cx="160" cy="58" r="4" fill="#fde047"/>
          </svg>`
      },
      fireTruck: {
        name: "Fire Truck",
        color: "#ef4444",
        svg: () => `
          <svg class="vehicle-svg" viewBox="0 0 180 96" role="img" aria-label="Fire truck">
            <rect x="22" y="39" width="100" height="31" rx="8" fill="#ef4444"/>
            <path d="M116 31h28c10 0 18 13 20 27h-48z" fill="#dc2626"/>
            <rect x="124" y="36" width="20" height="16" rx="3" fill="#fee2e2"/>
            <rect x="36" y="29" width="64" height="9" rx="5" fill="#fef3c7"/>
            <rect x="43" y="21" width="71" height="7" rx="4" fill="#9ca3af"/>
            <rect x="55" y="47" width="30" height="13" rx="3" fill="#fee2e2"/>
            <rect x="9" y="58" width="22" height="12" rx="5" fill="#991b1b"/>
            <rect x="158" y="58" width="15" height="10" rx="5" fill="#991b1b"/>
            <circle cx="93" cy="31" r="8" fill="#facc15"/>
            <circle class="wheel" cx="53" cy="72" r="15" fill="#111827"/>
            <circle cx="53" cy="72" r="6" fill="#e5e7eb"/>
            <circle class="wheel" cx="132" cy="72" r="15" fill="#111827"/>
            <circle cx="132" cy="72" r="6" fill="#e5e7eb"/>
            <circle cx="166" cy="55" r="4" fill="#fde047"/>
          </svg>`
      },
      dumpTruck: {
        name: "Dump Truck",
        color: "#eab308",
        svg: () => `
          <svg class="vehicle-svg" viewBox="0 0 180 96" role="img" aria-label="Dump truck">
            <path d="M22 35h86l-12 34H34z" fill="#eab308"/>
            <path d="M110 38h34c9 0 17 13 20 30h-54z" fill="#ca8a04"/>
            <rect x="119" y="43" width="19" height="15" rx="3" fill="#fef9c3"/>
            <rect x="28" y="30" width="76" height="8" rx="4" fill="#fde047"/>
            <rect x="8" y="58" width="24" height="12" rx="5" fill="#854d0e"/>
            <circle class="wheel" cx="54" cy="72" r="16" fill="#111827"/>
            <circle cx="54" cy="72" r="7" fill="#d1d5db"/>
            <circle class="wheel" cx="133" cy="72" r="16" fill="#111827"/>
            <circle cx="133" cy="72" r="7" fill="#d1d5db"/>
            <circle cx="166" cy="57" r="4" fill="#fde047"/>
          </svg>`
      },
      tractor: {
        name: "Tractor",
        color: "#84cc16",
        svg: () => `
          <svg class="vehicle-svg" viewBox="0 0 180 96" role="img" aria-label="Tractor">
            <g transform="translate(180 0) scale(-1 1)">
              <rect x="76" y="35" width="45" height="28" rx="7" fill="#84cc16"/>
              <rect x="112" y="23" width="32" height="40" rx="7" fill="#65a30d"/>
              <rect x="118" y="29" width="18" height="19" rx="3" fill="#ecfccb"/>
              <rect x="45" y="50" width="38" height="14" rx="7" fill="#84cc16"/>
              <rect x="58" y="40" width="22" height="12" rx="5" fill="#facc15"/>
              <rect x="138" y="15" width="8" height="17" rx="3" fill="#374151"/>
              <circle class="wheel" cx="55" cy="70" r="15" fill="#111827"/>
              <circle cx="55" cy="70" r="6" fill="#d1d5db"/>
              <circle class="wheel" cx="125" cy="68" r="24" fill="#111827"/>
              <circle cx="125" cy="68" r="11" fill="#d1d5db"/>
              <circle cx="43" cy="53" r="4" fill="#fde047"/>
            </g>
          </svg>`
      }
    };

    const els = {
      minutesInput: document.getElementById("minutesInput"),
      startPauseButton: document.getElementById("startPauseButton"),
      resetButton: document.getElementById("resetButton"),
      vehicleGrid: document.getElementById("vehicleGrid"),
      vehicleMount: document.getElementById("vehicleMount"),
      vehicleLayer: document.getElementById("vehicleLayer"),
      timeDisplay: document.getElementById("timeDisplay"),
      timeLabel: document.getElementById("timeLabel"),
      progressFill: document.getElementById("progressFill"),
      progressText: document.getElementById("progressText"),
      lapText: document.getElementById("lapText"),
      statusDot: document.getElementById("statusDot"),
      statusText: document.getElementById("statusText"),
      trackCard: document.getElementById("trackCard"),
      soundToggle: document.getElementById("soundToggle"),
      confetti: document.getElementById("confetti")
    };

    const now = () => Date.now();

    let state = loadState();
    let animationFrame = null;
    let lastSavedAt = 0;

    function defaultState() {
      return {
        durationMs: DEFAULT_MINUTES * 60 * 1000,
        remainingMs: DEFAULT_MINUTES * 60 * 1000,
        startedAt: null,
        endsAt: null,
        status: "stopped",
        vehicle: "bigTruck",
        soundOn: true,
        completedCelebrated: false
      };
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!saved) return defaultState();
        const merged = { ...defaultState(), ...saved };
        if (merged.status === "running" && merged.endsAt) {
          merged.remainingMs = Math.max(0, merged.endsAt - now());
          if (merged.remainingMs <= 0) merged.status = "done";
        }
        return merged;
      } catch {
        return defaultState();
      }
    }

    function saveState(force = false) {
      const t = now();
      if (!force && t - lastSavedAt < 500) return;
      lastSavedAt = t;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function formatTime(ms) {
      const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${minutes}:${String(seconds).padStart(2, "0")}`;
    }

    function clampMinutes(value) {
      const minutes = Number.parseInt(value, 10);
      if (!Number.isFinite(minutes)) return DEFAULT_MINUTES;
      return Math.max(1, Math.min(240, minutes));
    }

    function setDurationMinutes(minutes, preserveStatus = false) {
      const clean = clampMinutes(minutes);
      const ms = clean * 60 * 1000;
      state.durationMs = ms;
      if (!preserveStatus || state.status === "stopped" || state.status === "done") {
        state.remainingMs = ms;
        state.startedAt = null;
        state.endsAt = null;
        state.status = "stopped";
        state.completedCelebrated = false;
      }
      els.minutesInput.value = clean;
      saveState(true);
      render();
    }

    function startTimer() {
      if (state.status === "done") {
        state.remainingMs = state.durationMs;
        state.completedCelebrated = false;
      }
      state.status = "running";
      state.startedAt = now();
      state.endsAt = state.startedAt + state.remainingMs;
      saveState(true);
      tick();
    }

    function pauseTimer() {
      state.remainingMs = Math.max(0, state.endsAt - now());
      state.status = "paused";
      state.startedAt = null;
      state.endsAt = null;
      saveState(true);
      render();
    }

    function resetTimer() {
      state.remainingMs = state.durationMs;
      state.startedAt = null;
      state.endsAt = null;
      state.status = "stopped";
      state.completedCelebrated = false;
      saveState(true);
      render();
    }

    function finishTimer() {
      state.remainingMs = 0;
      state.startedAt = null;
      state.endsAt = null;
      state.status = "done";
      saveState(true);
      render();
      celebrate();
    }

    function tick() {
      if (animationFrame) cancelAnimationFrame(animationFrame);
      if (state.status !== "running") return;

      state.remainingMs = Math.max(0, state.endsAt - now());
      if (state.remainingMs <= 0) {
        finishTimer();
        return;
      }

      saveState(false);
      render();
      animationFrame = requestAnimationFrame(tick);
    }

    function progress() {
      if (!state.durationMs) return 0;
      return Math.min(1, Math.max(0, (state.durationMs - state.remainingMs) / state.durationMs));
    }

    function render() {
      const pct = progress();
      const degrees = pct * 360;
      const lap = Math.floor(pct * 4) + 1;
      const status = state.status;

      els.vehicleLayer.style.transform = `rotate(${degrees}deg)`;
      els.timeDisplay.textContent = formatTime(state.remainingMs);
      els.progressFill.style.width = `${Math.round(pct * 100)}%`;
      els.progressText.textContent = `${Math.round(pct * 100)}% driven`;
      els.lapText.textContent = pct >= 1 ? "Finished!" : `Lap ${Math.min(4, lap)}`;
      els.minutesInput.value = Math.round(state.durationMs / 60000);
      els.vehicleMount.innerHTML = vehicles[state.vehicle].svg();

      els.trackCard.classList.remove("running", "paused", "stopped", "done");
      els.trackCard.classList.add(status);
      els.statusDot.className = `status-dot ${status}`;

      if (status === "running") {
        els.statusText.textContent = "Driving";
        els.timeLabel.textContent = "keep going!";
        els.startPauseButton.textContent = "Pause";
        els.startPauseButton.className = "primary-button pause";
      } else if (status === "paused") {
        els.statusText.textContent = "Parked for now";
        els.timeLabel.textContent = "paused";
        els.startPauseButton.textContent = "Keep driving";
        els.startPauseButton.className = "primary-button";
      } else if (status === "done") {
        els.statusText.textContent = "All done!";
        els.timeLabel.textContent = "great drive!";
        els.startPauseButton.textContent = "Drive again";
        els.startPauseButton.className = "primary-button restart";
      } else {
        els.statusText.textContent = "Ready to roll";
        els.timeLabel.textContent = "ready for a drive";
        els.startPauseButton.textContent = "Start driving";
        els.startPauseButton.className = "primary-button";
      }

      document.querySelectorAll(".vehicle-option").forEach(button => {
        button.classList.toggle("selected", button.dataset.vehicle === state.vehicle);
        button.setAttribute("aria-pressed", String(button.dataset.vehicle === state.vehicle));
      });

      els.soundToggle.classList.toggle("on", state.soundOn);
      els.soundToggle.setAttribute("aria-pressed", String(state.soundOn));
    }

    function renderVehicleButtons() {
      els.vehicleGrid.innerHTML = Object.entries(vehicles).map(([key, vehicle]) => `
        <button class="vehicle-option" data-vehicle="${key}" aria-pressed="false">
          <div class="vehicle-preview">${vehicle.svg()}</div>
          <span>${vehicle.name}</span>
        </button>
      `).join("");
    }

    function celebrate() {
      if (state.completedCelebrated) return;
      state.completedCelebrated = true;
      saveState(true);
      popConfetti();
      if (state.soundOn) playCelebrationSound();
    }

    function popConfetti() {
      els.confetti.innerHTML = "";
      for (let i = 0; i < 70; i++) {
        const span = document.createElement("span");
        span.style.left = `${Math.random() * 100}%`;
        span.style.animationDelay = `${Math.random() * 1.4}s`;
        span.style.animationDuration = `${1.8 + Math.random() * 1.4}s`;
        span.style.setProperty("--fall-x", `${-90 + Math.random() * 180}px`);
        els.confetti.appendChild(span);
      }
      setTimeout(() => {
        if (state.status !== "done") els.confetti.innerHTML = "";
      }, 4200);
    }

    function playCelebrationSound() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      const ctx = new AudioContext();
      const notes = [262, 330, 392, 523, 392, 523];
      notes.forEach((freq, index) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = index % 2 ? "triangle" : "sine";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, ctx.currentTime + index * 0.13);
        gain.gain.exponentialRampToValueAtTime(0.16, ctx.currentTime + index * 0.13 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + index * 0.13 + 0.12);
        osc.connect(gain).connect(ctx.destination);
        osc.start(ctx.currentTime + index * 0.13);
        osc.stop(ctx.currentTime + index * 0.13 + 0.14);
      });
    }

    function attachEvents() {
      els.startPauseButton.addEventListener("click", () => {
        if (state.status === "running") pauseTimer();
        else startTimer();
      });

      els.resetButton.addEventListener("click", resetTimer);

      els.minutesInput.addEventListener("change", () => setDurationMinutes(els.minutesInput.value));

      document.querySelectorAll(".chip").forEach(button => {
        button.addEventListener("click", () => setDurationMinutes(button.dataset.minutes));
      });

      els.vehicleGrid.addEventListener("click", event => {
        const button = event.target.closest(".vehicle-option");
        if (!button) return;
        state.vehicle = button.dataset.vehicle;
        saveState(true);
        render();
      });

      els.soundToggle.addEventListener("click", () => {
        state.soundOn = !state.soundOn;
        saveState(true);
        render();
      });

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible" && state.status === "running") {
          state.remainingMs = Math.max(0, state.endsAt - now());
          if (state.remainingMs <= 0) finishTimer();
          else tick();
        }
      });
    }

    function init() {
      renderVehicleButtons();
      attachEvents();
      render();
      if (state.status === "running") tick();
      if (state.status === "done") popConfetti();
    }

    init();
  </script>
</body>
</html>
