<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🚛 Truck Timer</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%}
body{
  font-family:'Trebuchet MS','Arial Rounded MT Bold',Arial,sans-serif;
  background:linear-gradient(165deg,#5ba4d8 0%,#87ceeb 50%,#68c46b 100%);
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
  padding:14px 8px 28px;gap:12px;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
}
h1{font-size:clamp(1.5rem,6vw,2.2rem);font-weight:900;color:#fff;
  text-shadow:2px 2px 0 #1662a8,4px 5px 0 rgba(0,0,0,.2);letter-spacing:3px;
  text-align:center;}
#clock{font-size:clamp(3rem,13vw,5.2rem);font-weight:900;color:#fff;
  text-shadow:2px 3px 0 #1662a8,5px 7px 0 rgba(0,0,0,.22);letter-spacing:6px;
  line-height:1;font-variant-numeric:tabular-nums;}
.track-wrap{width:100%;max-width:700px;border-radius:20px;overflow:hidden;
  box-shadow:0 10px 32px rgba(0,0,0,.38);}
.track-wrap svg{display:block;width:100%;height:auto;}
.lbl{font-size:.72rem;font-weight:900;color:rgba(255,255,255,.88);
  text-transform:uppercase;letter-spacing:2.5px;text-shadow:1px 1px 0 rgba(0,0,0,.25);}
.v-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:700px;}
.v-btn{display:flex;flex-direction:column;align-items:center;gap:3px;
  width:62px;padding:7px 4px 5px;
  border:3px solid rgba(255,255,255,.22);border-radius:14px;
  background:rgba(255,255,255,.17);cursor:pointer;font-family:inherit;
  transition:transform .12s,border-color .12s,background .12s,box-shadow .12s;}
.v-btn .ve{font-size:1.75rem;line-height:1;}
.v-btn .vn{font-size:.48rem;font-weight:700;color:rgba(255,255,255,.85);
  text-shadow:1px 1px 0 rgba(0,0,0,.3);text-align:center;line-height:1.2;}
.v-btn:hover{background:rgba(255,255,255,.34);transform:translateY(-2px) scale(1.06);}
.v-btn.on{border-color:#fff;background:rgba(255,255,255,.54);
  box-shadow:0 4px 14px rgba(0,0,0,.22);transform:translateY(-3px) scale(1.1);}
.v-btn.on .vn{color:#1a58a8;text-shadow:none;}
.t-row{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:700px;}
.t-btn{padding:8px 13px;font-size:.9rem;font-weight:900;font-family:inherit;
  border:3px solid rgba(255,255,255,.22);border-radius:12px;
  background:rgba(255,255,255,.17);color:#fff;cursor:pointer;
  text-shadow:1px 1px 0 rgba(0,0,0,.2);transition:all .12s;}
.t-btn:hover{background:rgba(255,255,255,.34);transform:translateY(-1px);}
.t-btn.on{border-color:#fff;background:rgba(255,255,255,.62);
  color:#1a58a8;text-shadow:none;box-shadow:0 3px 10px rgba(0,0,0,.15);}
.ctrl{display:flex;gap:12px;}
.btn-s,.btn-r{padding:14px 30px;font-size:clamp(.85rem,3.5vw,1.15rem);
  font-weight:900;font-family:inherit;border:none;border-radius:16px;cursor:pointer;
  text-transform:uppercase;letter-spacing:1px;transition:transform .1s,box-shadow .1s;}
.btn-s{min-width:145px;background:linear-gradient(175deg,#3dde78,#27ae60);color:#fff;
  box-shadow:0 6px 0 #1b7a42,0 9px 18px rgba(0,0,0,.22);}
.btn-s:hover{transform:translateY(-2px);box-shadow:0 8px 0 #1b7a42,0 12px 20px rgba(0,0,0,.22);}
.btn-s:active{transform:translateY(4px);box-shadow:0 2px 0 #1b7a42;}
.btn-s.pause{background:linear-gradient(175deg,#ff6b6b,#c0392b);
  box-shadow:0 6px 0 #8e1c10,0 9px 18px rgba(0,0,0,.22);}
.btn-s.pause:hover{box-shadow:0 8px 0 #8e1c10,0 12px 20px rgba(0,0,0,.22);}
.btn-s.pause:active{box-shadow:0 2px 0 #8e1c10;}
.btn-s:disabled{background:linear-gradient(175deg,#b2bec3,#95a5a6);
  box-shadow:0 6px 0 #7f8c8d;cursor:default;transform:none!important;}
.btn-r{background:linear-gradient(175deg,#f5a623,#e67e22);color:#fff;
  box-shadow:0 6px 0 #9d5208,0 9px 18px rgba(0,0,0,.22);}
.btn-r:hover{transform:translateY(-2px);box-shadow:0 8px 0 #9d5208,0 12px 20px rgba(0,0,0,.22);}
.btn-r:active{transform:translateY(4px);box-shadow:0 2px 0 #9d5208;}
.done-overlay{position:fixed;inset:0;background:rgba(0,0,40,.8);
  z-index:999;align-items:center;justify-content:center;display:none;}
.done-overlay.show{display:flex;}
.done-card{background:#fff;border-radius:30px;padding:34px 44px;
  display:flex;flex-direction:column;align-items:center;gap:12px;
  animation:zpop .45s cubic-bezier(.34,1.56,.64,1) forwards;
  box-shadow:0 20px 60px rgba(0,0,0,.45);max-width:88vw;text-align:center;}
.d-big{font-size:5rem;display:block;animation:djig .45s infinite alternate;}
.d-h{font-size:1.9rem;font-weight:900;color:#1a58a8;}
.d-sub{font-size:.95rem;color:#666;}
.d-ok{margin-top:6px;padding:12px 42px;font-size:1.1rem;font-weight:900;
  font-family:inherit;background:linear-gradient(175deg,#3dde78,#27ae60);
  color:#fff;border:none;border-radius:14px;cursor:pointer;
  box-shadow:0 5px 0 #1b7a42;text-transform:uppercase;}
.d-ok:active{transform:translateY(5px);box-shadow:none;}
@keyframes zpop{from{transform:scale(.25);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes djig{from{transform:rotate(-12deg) scale(1)}to{transform:rotate(12deg) scale(1.12)}}
</style>
</head>
<body>

<h1>🚛 Truck Timer</h1>
<div id="clock">10:00</div>

<div class="track-wrap">
<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky -->
  <rect width="700" height="380" fill="#87ceeb"/>
  <!-- Sun -->
  <circle cx="636" cy="52" r="36" fill="#ffe033"/>
  <g stroke="#ffe033" stroke-width="4" stroke-linecap="round" opacity=".6">
    <line x1="636" y1="9" x2="636" y2="1"/>
    <line x1="661" y1="17" x2="667" y2="10"/>
    <line x1="678" y1="52" x2="686" y2="52"/>
    <line x1="661" y1="87" x2="667" y2="94"/>
    <line x1="636" y1="95" x2="636" y2="103"/>
    <line x1="611" y1="87" x2="605" y2="94"/>
    <line x1="594" y1="52" x2="586" y2="52"/>
    <line x1="611" y1="17" x2="605" y2="10"/>
  </g>
  <!-- Clouds -->
  <g fill="white" opacity=".9">
    <ellipse cx="88" cy="68" rx="55" ry="27"/>
    <ellipse cx="126" cy="56" rx="44" ry="25"/>
    <ellipse cx="58" cy="63" rx="33" ry="20"/>
  </g>
  <g fill="white" opacity=".82">
    <ellipse cx="395" cy="42" rx="48" ry="24"/>
    <ellipse cx="432" cy="32" rx="36" ry="20"/>
    <ellipse cx="367" cy="39" rx="29" ry="17"/>
  </g>
  <!-- Ground -->
  <rect y="305" width="700" height="75" fill="#5dbb63"/>
  <rect y="305" width="700" height="10" fill="#4caf50" opacity=".55"/>

  <!-- Track shadow -->
  <ellipse cx="352" cy="207" rx="264" ry="113" fill="none" stroke="#1a1a1a" stroke-width="78" opacity=".2"/>
  <!-- Road surface -->
  <ellipse cx="350" cy="205" rx="260" ry="110" fill="none" stroke="#888" stroke-width="73"/>

  <!-- Progress arc (elapsed time, color-coded) — same path as #road -->
  <path id="arc"
    d="M 610,205 A 260,110 0 0 1 350,315 A 260,110 0 0 1 90,205 A 260,110 0 0 1 350,95 A 260,110 0 0 1 610,205"
    fill="none" stroke="#4fc3f7" stroke-width="61"
    stroke-dasharray="0 9999" stroke-linecap="butt" opacity=".85"/>

  <!-- Lane dashes -->
  <ellipse cx="350" cy="205" rx="260" ry="110"
    fill="none" stroke="rgba(255,255,255,.6)" stroke-width="2.5" stroke-dasharray="21 13"/>
  <!-- Outer curb -->
  <ellipse cx="350" cy="205" rx="260" ry="110"
    fill="none" stroke="white" stroke-width="4.5" opacity=".7"/>
  <!-- Inner curb -->
  <ellipse cx="350" cy="205" rx="222" ry="72"
    fill="none" stroke="white" stroke-width="4" opacity=".7"/>
  <!-- Infield grass -->
  <ellipse cx="350" cy="205" rx="218" ry="68" fill="#5dbb63"/>
  <ellipse cx="350" cy="205" rx="196" ry="52" fill="#6dcf6d" opacity=".4"/>

  <!-- Start/finish flag -->
  <text x="622" y="168" font-size="26" text-anchor="middle"
    style="filter:drop-shadow(1px 2px 3px rgba(0,0,0,.4))">🏁</text>
  <line x1="622" y1="168" x2="622" y2="187" stroke="#555" stroke-width="2.5" opacity=".7"/>

  <!-- Hidden motion path (clockwise from rightmost point) -->
  <path id="road"
    d="M 610,205 A 260,110 0 0 1 350,315 A 260,110 0 0 1 90,205 A 260,110 0 0 1 350,95 A 260,110 0 0 1 610,205"
    fill="none" stroke="transparent"/>

  <!-- Vehicle group (JS-positioned) -->
  <g id="vg" transform="translate(610,205) rotate(90) scale(1,1)">
    <text id="ve" x="0" y="0" text-anchor="middle" dominant-baseline="central"
      font-size="44" style="filter:drop-shadow(1px 3px 3px rgba(0,0,0,.45))">🚛</text>
  </g>
</svg>
</div>

<span class="lbl">Pick Your Vehicle</span>
<div class="v-row" id="vrow"></div>

<span class="lbl">Pick Your Time</span>
<div class="t-row" id="trow"></div>

<div class="ctrl">
  <button class="btn-s" id="bs">▶ Start</button>
  <button class="btn-r" id="br">↺ Reset</button>
</div>

<div class="done-overlay" id="done">
  <div class="done-card">
    <span class="d-big" id="dem">🚛</span>
    <div class="d-h">Time's Up! 🎉</div>
    <div class="d-sub">Great job waiting!</div>
    <button class="d-ok" id="dok">Yay! ✓</button>
  </div>
</div>

<script>
const VLIST=[
  {e:'🚛',n:'Big Truck'},{e:'🚚',n:'Pickup'},{e:'🚗',n:'Car'},
  {e:'🚒',n:'Fire Truck'},{e:'🚌',n:'School Bus'},{e:'🏎️',n:'Race Car'},
  {e:'🚓',n:'Police Car'},{e:'🚜',n:'Tractor'}
];
const TIMES=[1,2,5,10,15,20,30];
const KEY='truckTimer_v4';
let S={vi:0,total:600,paused:0,running:false,ts:null,done:false};
let tlen=0,raf=null;

const elClock=document.getElementById('clock');
const elArc=document.getElementById('arc');
const elRoad=document.getElementById('road');
const elVg=document.getElementById('vg');
const elVe=document.getElementById('ve');
const elBs=document.getElementById('bs');
const elDone=document.getElementById('done');
const elDem=document.getElementById('dem');

function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY)||'null');
    if(!d)return;
    Object.assign(S,d);
    if(S.running&&S.ts){
      const add=(Date.now()-S.ts)/1e3;
      S.paused=Math.min(S.paused+add,S.total);
      if(S.paused>=S.total){S.running=false;S.done=true;S.paused=S.total;}
      S.ts=S.running?Date.now():null;
    }
  }catch(e){}
}
function elapsed(){
  return S.running&&S.ts?Math.min(S.paused+(Date.now()-S.ts)/1e3,S.total):Math.min(S.paused,S.total);
}
function fmt(s){
  const m=Math.floor(s/60),ss=Math.floor(s%60);
  return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0');
}

function render(){
  const el=elapsed(),rem=Math.max(0,S.total-el),pct=el/S.total;
  elClock.textContent=fmt(rem);

  if(tlen>0){
    const len=Math.min(pct,0.99999)*tlen;
    elArc.setAttribute('stroke-dasharray',len+' '+(tlen+100));
    elArc.setAttribute('stroke',pct<.5?'#4fc3f7':pct<.75?'#ffd54f':'#ff7043');

    const pt=elRoad.getPointAtLength(len);
    const d2=Math.min(18,tlen*0.012);
    const pt2=elRoad.getPointAtLength((len+d2)%tlen);
    let ang=Math.atan2(pt2.y-pt.y,pt2.x-pt.x)*180/Math.PI,flip=-1;
    if(ang>90||ang<-90){flip=1;ang+=ang>0?-180:180;}
    elVg.setAttribute('transform','translate('+pt.x+','+pt.y+') rotate('+ang+') scale('+flip+',1)');
  }

  if(S.done){
    elBs.textContent='✓ Done!';elBs.disabled=true;elBs.className='btn-s';
    elDem.textContent=VLIST[S.vi].e;
    elDone.classList.add('show');
  } else if(S.running){
    elBs.textContent='⏸ Pause';elBs.disabled=false;elBs.className='btn-s pause';
  } else {
    elBs.textContent=elapsed()>0.5?'▶ Resume':'▶ Start';
    elBs.disabled=false;elBs.className='btn-s';
  }
}

function tick(){
  if(elapsed()>=S.total){
    S.running=false;S.done=true;S.paused=S.total;S.ts=null;
    save();render();return;
  }
  render();raf=requestAnimationFrame(tick);
}
function doStart(){if(S.done)return;S.running=true;S.ts=Date.now();save();if(raf)cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);}
function doPause(){S.paused=elapsed();S.running=false;S.ts=null;save();if(raf)cancelAnimationFrame(raf);render();}
function doReset(){if(raf)cancelAnimationFrame(raf);S.paused=0;S.running=false;S.ts=null;S.done=false;elDone.classList.remove('show');save();render();}
function pickV(i){S.vi=i;save();elVe.textContent=VLIST[i].e;document.querySelectorAll('.v-btn').forEach(function(b,j){b.classList.toggle('on',j===i);});}
function pickT(m){if(S.running)return;doReset();S.total=m*60;save();document.querySelectorAll('.t-btn').forEach(function(b){b.classList.toggle('on',+b.dataset.m===m);});render();}

const vrow=document.getElementById('vrow');
VLIST.forEach(function(v,i){
  const b=document.createElement('button');
  b.className='v-btn';
  b.innerHTML='<span class="ve">'+v.e+'</span><span class="vn">'+v.n+'</span>';
  b.onclick=function(){pickV(i);};
  vrow.appendChild(b);
});
const trow=document.getElementById('trow');
TIMES.forEach(function(m){
  const b=document.createElement('button');
  b.className='t-btn';b.dataset.m=m;b.textContent=m+' min';
  b.onclick=function(){pickT(m);};
  trow.appendChild(b);
});
elBs.onclick=function(){S.running?doPause():doStart();};
document.getElementById('br').onclick=doReset;
document.getElementById('dok').onclick=doReset;

load();
elVe.textContent=VLIST[S.vi].e;

function init(){
  tlen=elRoad.getTotalLength();
  if(!tlen){setTimeout(init,60);return;}
  document.querySelectorAll('.v-btn').forEach(function(b,i){b.classList.toggle('on',i===S.vi);});
  const cm=S.total/60;
  document.querySelectorAll('.t-btn').forEach(function(b){b.classList.toggle('on',+b.dataset.m===cm);});
  render();
  if(S.running)raf=requestAnimationFrame(tick);
}
requestAnimationFrame(function(){requestAnimationFrame(init);});
</script>
</body>
</html>
